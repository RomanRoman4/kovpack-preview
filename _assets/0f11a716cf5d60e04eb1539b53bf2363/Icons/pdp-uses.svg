<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    KOVPACK application icons (own drawings), drawn on a 48 grid; each symbol viewBox is cropped to its drawing so all icons fill the same square and share the bottom line; line icons in currentColor;
    strokes scale with the CSS var use-stroke; the protective paper sheet takes the product label colour (CSS var use-accent).
    Use: <svg viewBox="0 0 48 48"><use href="pdp-uses.svg#use-painting"/></svg>
  -->

  <symbol id="use-painting" viewBox="2 1 44 44">
    <path d="M8 37h36l-4 6H4z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <rect x="10" y="5" width="22" height="8" rx="2"/>
      <path d="M32 9h4v7H22v5"/>
      <path d="M22 21v9" style="stroke-width: calc(3.2px * var(--use-stroke, 1))"/>
    </g>
    <g fill="currentColor">
      <path d="M13 17c1.4 2 2 3 2 4a2 2 0 0 1-4 0c0-1 .6-2 2-4z"/>
      <path d="M33 23c1.2 1.7 1.7 2.6 1.7 3.4a1.7 1.7 0 0 1-3.4 0c0-.8.5-1.7 1.7-3.4z"/>
      <ellipse cx="15" cy="39.6" rx="3.4" ry="1.1"/>
      <ellipse cx="32" cy="39.8" rx="2.4" ry=".9"/>
    </g>
  </symbol>

  <symbol id="use-plaster" viewBox="2 1 44 44">
    <path d="M8 37h36l-4 6H4z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <path d="M8 24h28l3 3H11z"/>
      <path d="M17 24v-6h10v6"/>
      <rect x="14" y="9" width="16" height="9" rx="3"/>
    </g>
    <g fill="currentColor">
      <path d="M22 38.4c1.5-2.4 4-3.2 6.4-2 1.9-1 4.1-.4 5 1.4.3.6-.1 1.3-.8 1.3H22.6c-.6 0-.9-.4-.6-.7z"/>
      <circle cx="16" cy="32" r="1.3"/>
      <circle cx="12.5" cy="35" r="1"/>
    </g>
  </symbol>

  <symbol id="use-stairs" viewBox="2 2 44 44">
    <path d="M4 44h40V18H34v8H24v8H14v8H4z" fill="none" stroke="currentColor" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"/>
    <path d="M4 39.5h7.5V31.5h10V23.5h10V15.5H44" fill="none" stroke-linejoin="round" style="stroke-width: calc(3.4px * var(--use-stroke, 1)); stroke: var(--use-accent, #e89357)"/>
  </symbol>

  <symbol id="use-floor" viewBox="2 2 44 44">
    <g fill="none" stroke="currentColor" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <path d="M15 10h29l-5 33H4z"/>
      <path d="M31 10l-4.6 33M38 10l-4.8 33M29.5 21h12.8M28 32h12.5" style="stroke-width: calc(1.4px * var(--use-stroke, 1))"/>
    </g>
    <path d="M15 10h9l-6 33H4z" style="fill: var(--use-accent, #e89357)"/>
    <ellipse cx="21" cy="26.5" rx="4.5" ry="17" transform="rotate(10 21 26.5)" fill="none" stroke="currentColor" style="stroke-width: calc(1.8px * var(--use-stroke, 1)); fill: var(--use-surface, #fffdf8)"/>
    <circle cx="21" cy="26.5" r="1.6" fill="currentColor"/>
  </symbol>

  <symbol id="use-fitting" viewBox="2 1 44 44">
    <path d="M8 37h36l-4 6H4z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <rect x="9" y="11" width="22" height="26" rx="1.5"/>
      <path d="M9 19h22M20 19v18M16.5 26v4M23.5 26v4M14 15h12"/>
      <path d="M41 9l-6 6m0 0-2.5 2.5 2 2L37 17m-2-2 2 2"/>
      <path d="M38.5 7.5l3 3" style="stroke-width: calc(3px * var(--use-stroke, 1))"/>
    </g>
  </symbol>

  <symbol id="use-moving" viewBox="2 1 44 44">
    <path d="M8 37h36l-4 6H4z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <path d="M10 6h3v28h20"/>
      <circle cx="15" cy="36" r="3" style="fill: var(--use-surface, #fffdf8)"/>
      <rect x="16" y="19" width="14" height="15" rx="1"/>
      <path d="M21 19v5h4v-5"/>
      <rect x="18" y="8" width="11" height="11" rx="1"/>
    </g>
  </symbol>

  <!-- Material properties (smaller row under the applications) -->
  <symbol id="trait-weight" viewBox="3 -3 43 43">
    <path d="M10 25h34l-5 8H5z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <path d="M5 33v5h34l5-8v-5M39 33v5"/>
      <path d="M17 10h14l3 11H14z" style="fill: var(--use-surface, #fffdf8)"/>
      <path d="M21 10V7.5a3 3 0 0 1 6 0V10"/>
    </g>
  </symbol>

  <symbol id="trait-tape" viewBox="2 2.5 42.5 42.5">
    <path d="M4 28h28l-5 15H4z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <rect x="17" y="29" width="18" height="7" rx="1" transform="rotate(-24 26 32.5)" style="fill: var(--use-surface, #fffdf8)"/>
      <circle cx="34" cy="13" r="8.5"/>
      <circle cx="34" cy="13" r="3.5"/>
      <path d="M25.6 14.5 21 26"/>
    </g>
  </symbol>

  <symbol id="trait-cut" viewBox="1 -2 45 45">
    <path d="M8 22h36l-5 19H3z" style="fill: var(--use-accent, #e89357)"/>
    <path d="M23.5 26 20.6 41" fill="none" stroke="currentColor" stroke-linecap="round" stroke-dasharray="2.2 2.6" style="stroke-width: calc(1.6px * var(--use-stroke, 1))"/>
    <g stroke="currentColor" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <path d="M24 25.5l1.4-6.2 3.6 1.4z" fill="currentColor"/>
      <path d="M26 18.6 31.5 5l4.6 1.8-5.6 13.6z" style="fill: var(--use-surface, #fffdf8)"/>
    </g>
  </symbol>

  <symbol id="trait-paper" viewBox="4 3 42 42">
    <path d="M14 33h30l-4 10H6z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <path d="M13 17h24a6 8 0 0 1 0 16H13" style="fill: var(--use-surface, #fffdf8)"/>
      <ellipse cx="13" cy="25" rx="6" ry="8" style="fill: var(--use-surface, #fffdf8)"/>
      <circle cx="13" cy="25" r="2.2"/>
      <path d="M38 6c-6 0-9 3-9 8 5 0 9-3 9-8zM29 14c1-2.5 3-4.5 5.5-6"/>
    </g>
  </symbol>

  <!-- PACKING Paper (wrapping, lining, interleaving) -->
  <!-- Wrapping goods (owner, 2026-11-12: clearer than the envelope): a box
       wrapped in paper with a flap folded on its end; the sheet runs on from
       the box along the floor to the roll it comes off. -->
  <symbol id="pk-wrap" viewBox="3.5 -3 46 46">
    <path d="M22 41h15l6-6H28z" style="fill: var(--use-accent, #e89357)"/>
    <path d="M4 22h18v19H4zM4 22l6-6h18l-6 6zM22 22l6-6v19l-6 6z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><path d="M22 41h15M28 35h9M4 22h18v19H4zM4 22l6-6h18l-6 6M22 22l6-6v19l-6 6"/><path d="M22 22l3 8 3-14"/><path d="M36.03 35.03l6-6a3.5 3.5 0 0 1 4.94 4.94l-6 6z" style="fill: var(--use-surface, #fffdf8)"/><circle cx="38.5" cy="37.5" r="3.5" style="fill: var(--use-surface, #fffdf8)"/><circle cx="38.5" cy="37.5" r="1.1"/></g>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.3px * var(--use-stroke, 1))"><path d="M13 22v19M7 19l6-3" /></g>
  </symbol>
  <!-- Wrapping vases (owner, 2026-11-12, fourth drawing: the paper is the
       point, the vase must read as a vase): a flared vase with a zigzag
       ornament stands on a sheet of wrapping paper; the sheet's side corners
       and its front corner (lighter, the folded back) rise up around it. -->
  <symbol id="pk-vase" viewBox="1 1.5 46 46">
    <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <path d="M2 38 24 31l22 7-22 8z" style="fill: var(--use-accent, #e89357)"/>
      <path d="M15 3.5h18c0 2.5-3.5 3.5-5.5 5.5-.6.6-.8 1.5 0 2.2 5 2.8 8.5 6.3 8.5 12.3 0 6-3.5 11.5-7 15.5l1 3H18l1-3c-3.5-4-7-9.5-7-15.5s3.5-9.5 8.5-12.3c.8-.7.6-1.6 0-2.2C18.5 7 15 6 15 3.5z" style="fill: var(--use-surface, #fffdf8)"/>
      <path d="M14.6 18.5l2.35-2 2.35 2 2.35-2 2.35 2 2.35-2 2.35 2 2.35-2 2.35 2" fill="none" style="stroke-width: calc(1.3px * var(--use-stroke, 1))"/>
      <path d="M7 38.5 13 22l11 9zM41 38.5 35 22l-11 9z" style="fill: var(--use-accent, #e89357)"/>
      <path d="M11 41l13-11 13 11-13 5z" style="fill: color-mix(in srgb, var(--use-accent, #e89357) 60%, #fff)"/>
    </g>
  </symbol>
  <symbol id="pk-line" viewBox="2 0 44 44">
    <path d="M4 12l8 12h24l8-12-5 2.5-4.5-3-5 3-4.5-3-5 3-4.5-3z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><path d="M8 24h32v18H8z"/><path d="M8 24 4 31M40 24l4 7"/></g>
  </symbol>
  <!-- Lining shelves (owner, 2026-11-09): a two-board shelf; on each board a
       paper sheet (accent) whose front edge folds over the board, goods on top. -->
  <symbol id="pk-shelf" viewBox="2 3 44 44">
    <path d="M9 23.5h30V26H9zM12 26h24l-1.5 3h-21zM9 37.5h30V40H9zM12 40h24l-1.5 3h-21z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <path d="M7 12v32M41 12v32M7 26h34M7 40h34"/>
      <path d="M12 16h10v7.5H12zM27 15.5h7v8h-7zM28.5 13.5h4"/>
      <path d="M12 30.5h11v7H12zM27 32.5h8v5h-8z"/>
      <path d="M17.5 30.5v2.5" style="stroke-width: calc(1.4px * var(--use-stroke, 1))"/>
    </g>
  </symbol>

  <!-- FILL Paper (cushioning) -->
  <symbol id="fill-void" viewBox="2 0 44 44">
    <path d="M9 24c-1.5-7.5 4-12 9.5-9.5 2.5-5 9-5 11.5-.5 5.5-2 10 2 9.5 10z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><path d="M8 24h32v18H8z"/><path d="M8 24 4 17h7M40 24l4-7h-7"/><path d="M15 20l3 1.5 3-3 3 2.5 3-2 3 1.5 3-1" style="stroke-width: calc(1.4px * var(--use-stroke, 1))"/></g>
  </symbol>
  <symbol id="fill-fragile" viewBox="3.2 2 41 41">
    <path d="M7 41c-1-6 3-10 8-8.5 2-4.5 9-5 12-1 4.5-2.5 11 .5 11 6.5 3 .5 3.5 3 1 3z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><path d="M16 4h16c0 9-3.5 14-8 14s-8-5-8-14z"/><path d="M24 18v13"/><path d="M14 37l3-2 3 2M27 35l3 2 3-2" style="stroke-width: calc(1.4px * var(--use-stroke, 1))"/></g>
  </symbol>
  <symbol id="fill-parcel" viewBox="4 8 36 36">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><path d="M6 18h24v24H6z"/><path d="M6 18l8-8h24l-8 8M30 18l8-8v24l-8 8"/><path d="M14 18l8-8" style="stroke-width: calc(3px * var(--use-stroke, 1))"/></g>
    <rect x="10" y="28" width="13" height="9" rx="1" style="fill: var(--use-accent, #e89357)"/>
  </symbol>
  <symbol id="pk-interleave" viewBox="3 -0.5 42 42">
    <ellipse cx="24" cy="30" rx="19" ry="5" style="fill: var(--use-accent, #e89357)"/>
    <ellipse cx="24" cy="20" rx="19" ry="5" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><ellipse cx="24" cy="35" rx="16" ry="4.5" style="fill: var(--use-surface, #fffdf8)"/><ellipse cx="24" cy="25" rx="16" ry="4.5" style="fill: var(--use-surface, #fffdf8)"/><ellipse cx="24" cy="15" rx="16" ry="4.5" style="fill: var(--use-surface, #fffdf8)"/></g>
  </symbol>
  <!-- Pallet interlayers (owner, 2026-11-12): two layers of cartons on a
       pallet, a paper sheet under each layer, its ends hanging over the edge. -->
  <symbol id="pk-layers" viewBox="2 0 44 44">
    <path d="M4 25h40l-.8 4.5-1.7-2.5h-35l-1.7 2.5zM4 36h40l-.8 4.5-1.7-2.5h-35l-1.7 2.5z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><path d="M7 14h16v11H7zM25 14h16v11H25zM7 27h16v9H7zM25 27h16v9H25z" style="fill: var(--use-surface, #fffdf8)"/><path d="M5 38h38M8 38v4M24 38v4M40 38v4M5 42h38"/></g>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.3px * var(--use-stroke, 1))"><path d="M15 14v4M33 14v4M15 27v3.5M33 27v3.5"/></g>
  </symbol>
  <symbol id="trait-roll" viewBox="3 0 44 44">
    <path d="M16 29h29l-3 7H19z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><circle cx="16" cy="20" r="9" style="fill: var(--use-surface, #fffdf8)"/><circle cx="16" cy="20" r="3"/><path d="M9 42l7-13 7 13M5 42h22"/></g>
  </symbol>
  <symbol id="trait-format" viewBox="6 5.5 38 38">
    <path d="M12 14h26v14H12z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><ellipse cx="12" cy="21" rx="4" ry="7" style="fill: var(--use-surface, #fffdf8)"/><path d="M12 14h26a4 7 0 0 1 0 14H12"/><circle cx="12" cy="21" r="1.5"/><path d="M8 38h34M12 34.5 8 38l4 3.5M38 34.5l4 3.5-4 3.5"/></g>
  </symbol>
  <symbol id="fill-block" viewBox="4 4 40 40">
    <path d="M9 17h9v22H9zM30 17h9v22h-9z" style="fill: var(--use-accent, #e89357)"/>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))"><path d="M6 14h36v28H6z"/><rect x="20" y="20" width="8" height="16" rx="1" style="fill: var(--use-surface, #fffdf8)"/></g>
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.4px * var(--use-stroke, 1))"><path d="M11 21l2.5 2 2.5-2M11 28l2.5 2 2.5-2M11 35l2.5 2 2.5-2M32 21l2.5 2 2.5-2M32 28l2.5 2 2.5-2M32 35l2.5 2 2.5-2"/></g>
  </symbol>
  <symbol id="label-roll" viewBox="3 15 47 27">
    <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="stroke-width: calc(1.8px * var(--use-stroke, 1))">
      <path d="M11 40H38l2.25-.25.25-2.25 2.25-.25.25-2.25 2.25-.25.25-2.25 2.25-.25L48 30H21z" style="fill: var(--use-surface, #fffdf8)"/>
      <path d="M6.05 28.05 16.05 18.05A7 7 0 0 1 25.95 27.95L15.95 37.95A7 7 0 0 1 6.05 28.05z" style="fill: var(--use-surface, #fffdf8)"/>
      <circle cx="11" cy="33" r="7" style="fill: var(--use-surface, #fffdf8)"/>
      <circle cx="11" cy="33" r="2.4" fill="none"/>
    </g>
  </symbol>
</svg>
